<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SubmissionIQ - Underwriting Copilot</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">

<script>try{document.documentElement.dataset.theme=localStorage.getItem('siq-theme')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></symbol>
<symbol id="i-printer" viewBox="0 0 24 24"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>

<symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></symbol>

<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
<symbol id="i-pencil" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>

<symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>

<div id="pal" class="pal" hidden><div class="palbox"><input id="palq" placeholder="Type a command..." autocomplete="off"><ul id="pall"></ul><div class="palhint">&uarr;&darr; navigate &middot; Enter select &middot; Esc close</div></div></div>
<header class="top">
  <a class="brand" href="/" title="Back to home"><img class="lk lk-w" src="logo-lockup-white.svg" alt="SubmissionIQ"><img class="lk lk-d" src="logo-lockup-dark.svg" alt="SubmissionIQ"></a>
  <nav>
    <a href="#/" data-nav="#/">Work queue</a>
    <a href="#/new" data-nav="#/new">New submission</a>
    <a href="#/guidelines" data-nav="#/guidelines">Guidelines &amp; AI</a>
  </nav>
  <span class="tagline"><i></i>Agentic AI for commercial property underwriting</span>
  <button id="cmdk" class="btn kbtn" title="Quick actions"><svg class="ic"><use href="#i-search"/></svg> Quick actions <kbd>Ctrl K</kbd></button>
  <button id="theme" class="icon-btn" title="Toggle theme" aria-label="Toggle theme"></button>
</header>
<main id="app"></main>
<aside id="drawer" class="drawer" hidden><div class="dhead"><div id="dtitle"></div><button class="icon-btn" id="dclose" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button></div><div id="dbody"></div></aside>
<div id="toast" class="toast"></div>
<footer>Decision support only: a human underwriter makes every final decision. Demo uses synthetic data.</footer>
<script src="app.js"></script>
</body>
</html>
